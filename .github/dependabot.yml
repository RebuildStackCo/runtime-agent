# The Docker entry watches the two base images this repository builds on. They
# are pinned by digest (ADR 0085), and a pin is a promise to update it
# deliberately; this is what keeps that promise keepable — a `golang` patch
# release or a rebuilt `distroless` arrives as a pull request CI builds and
# scans, rather than as a number nobody looks at again.
#
# The gomod entry is not the vulnerability gate and never was: ADR 0038 measured
# that it sees one transitive module absent from the shipped image and none of
# the standard library inside it. `make vulncheck` is the gate.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
