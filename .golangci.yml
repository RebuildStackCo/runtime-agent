version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Property tests need deterministic, seedable randomness; crypto/rand
      # has no place in them.
      - path: _test\.go
        text: "G404:"

formatters:
  enable:
    - gofmt
    - goimports
