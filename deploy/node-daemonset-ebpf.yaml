# Node role — `ebpf` profile variant (ADR 0011). This is an ALTERNATIVE to
# node-daemonset.yaml, not an addition: it deploys the same node role with the
# eBPF CPU profiler enabled. Apply this OR the scanner-only manifest, never both
# (they share names). The eventual Helm chart collapses the two into one
# template gated by the install profile (security.md §3).
#
# The difference from the scanner-only manifest is deliberately small and
# auditable: exactly two added capabilities (CAP_BPF, CAP_PERFMON), one added
# read-only host mount (/sys/kernel for kernel BTF), and the
# -enable-ebpf master switch. Still NO privileged, NO writable host mount, and
# the same zero-RBAC identity. On a kernel < 5.8 or without BTF the profiler
# refuses gracefully and the node keeps running the scanner (ADR 0011 §2).
---
apiVersion: v1
kind: Namespace
metadata:
  name: runtime-agent
---
# Zero-RBAC identity — identical to the scanner variant. Bound to nothing;
# automountServiceAccountToken is false on the pod, so no API credential is ever
# placed in the container. Adding eBPF capabilities does NOT grant Kubernetes
# API access: capabilities are a kernel concept, RBAC is an API-server concept.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-agent-node
  namespace: runtime-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: runtime-agent-node
  namespace: runtime-agent
  labels:
    app.kubernetes.io/name: runtime-agent
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-agent
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime-agent
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: runtime-agent-node
      # No *API* credential in the container (see the scanner manifest for the
      # full argument). The projected token below is audience-bound to the
      # controller and rejected by the API server; zero RBAC still holds.
      automountServiceAccountToken: false
      # Share the host PID namespace so the scanner and profiler see node
      # processes (ADR 0009). Host PID plus CAP_BPF + CAP_PERFMON (container,
      # below) are this variant's host-level privileges — still no privileged
      # flag and no writable host path.
      hostPID: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 0
        runAsNonRoot: false
      tolerations:
        - operator: Exists
      containers:
        - name: node
          image: runtime-agent:latest
          args:
            - node
            - -proc
            - /host/proc
            - -interval
            - 60s
            # Enable the eBPF CPU profiler (ADR 0011). The master switch; the
            # eligible set and all ceilings come from the ConfigMap mounted
            # below via -config. On an unsupported kernel the node refuses
            # gracefully.
            - -enable-ebpf
            # The profiling config: eligible workload set, symbol allow-list,
            # capture cadence, overhead ceiling (ADR 0011). -enable-ebpf above is
            # the master switch; this is additive.
            - -config
            - /etc/runtime-agent/config.yaml
            # sysfs root for the BTF readiness check (<sys>/kernel/btf/vmlinux),
            # served by the read-only /sys/kernel mount below.
            - -sys
            - /sys
            - -controller-endpoint
            - http://runtime-agent-controller.runtime-agent.svc:8080/v1/node-inventory
            # Which pods on this node passed the customer's namespace filters
            # and opt-out annotations (ADR 0015); without it the scanner fails
            # closed and scans nothing.
            - -scope-endpoint
            - http://runtime-agent-controller.runtime-agent.svc:8080/v1/node-scope
            # Where to ask which containers to profile, and where to ship the
            # captured, filtered profiles (ADR 0011 §3, §5.5). Same controller
            # Service, same projected-token auth, different paths.
            - -targets-endpoint
            - http://runtime-agent-controller.runtime-agent.svc:8080/v1/node-targets
            - -profile-endpoint
            - http://runtime-agent-controller.runtime-agent.svc:8080/v1/node-profile
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                # Scanner capability (ADR 0009): read another container's
                # /proc/<pid>/exe past the ptrace access check.
                - SYS_PTRACE
                # eBPF profiler capabilities (ADR 0011, kernel 5.8+): load eBPF
                # programs and perform perf sampling. These two — and only these
                # two — are what the `ebpf` profile adds over the scanner. There
                # is still no privileged flag.
                - BPF
                - PERFMON
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              # Higher than the scanner's 100m: the profiler samples under an
              # overhead ceiling, but perf sampling and on-node symbolization
              # cost more than reading buildinfo.
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
              mountPropagation: HostToContainer
            - name: host-sys-kernel
              mountPath: /sys/kernel
              readOnly: true
            - name: controller-token
              mountPath: /var/run/secrets/rebuildstack.co/controller-token
              readOnly: true
            - name: config
              mountPath: /etc/runtime-agent
              readOnly: true
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        # Kernel BTF, read-only, for the profiler's CO-RE eBPF programs (stack
        # unwinding and on-node symbolization; ADR 0011, security.md §7.2). We
        # mount the always-present parent /sys/kernel rather than /sys/kernel/btf
        # directly: on a kernel without BTF the btf/ directory does not exist, and
        # a hostPath of a missing directory blocks the pod from starting — which
        # would defeat the graceful refusal whose whole point is that the node
        # still runs as the scanner. The readiness gate checks
        # /sys/kernel/btf/vmlinux under this mount and reports btf_absent when it
        # is missing.
        - name: host-sys-kernel
          hostPath:
            path: /sys/kernel
            type: Directory
        - name: controller-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: rebuildstack-controller
                  expirationSeconds: 3600
                  path: token
        # The profiling config (ADR 0011). Helm-rendered in a real install; here
        # a plain ConfigMap. Read once at startup, never reconfigured remotely
        # (ADR 0001).
        - name: config
          configMap:
            name: runtime-agent-node-config
---
# Sample profiling config. The eligible set is an explicit allow-list: with it
# empty, no workload is profiled — an operator opts specific namespaces in. The
# symbol allow-list is what makes shipping a stack trace defensible (ADR 0011 §4,
# security.md §8): only frames from these module prefixes leave the node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-agent-node-config
  namespace: runtime-agent
data:
  config.yaml: |
    profiling:
      # Which workloads may be profiled at all (empty = none).
      eligibleNamespaces: []
      # eligibleWorkloads: []          # optional, within the namespaces above
      # The customer's own Go module-path prefixes whose frames may leave the
      # node. Everything else (third-party, unsymbolized) is redacted.
      allowedModulePrefixes: []
      thirdPartySymbols: drop          # drop (default) | keep
      topN: 5
      captureDurationSeconds: 60
      intervalSeconds: 300
      overheadCeilingPercent: 5
