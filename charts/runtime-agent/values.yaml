# RebuildStack runtime agent.
#
# Everything the agent does is decided by this file. There is no control channel
# and nothing the backend sends can change agent behaviour (ADR 0001), so what
# you write here — and can diff in your GitOps history — is the whole of it.
#
# Unknown keys are rejected (values.schema.json), for the same reason the agent's
# own config parser is strict: a typo must not silently disable a filter.

# Which installation profile to install. Each is a superset of the one above it,
# and the profile is the only place the choice is made — there is no second knob
# that half-enables a component (docs/security.md §3).
#
#   metrics-only  the controller alone. No DaemonSet, no node privileges, no
#                 port opened for node reports. Usage rollups, workload and node
#                 metadata, the journals and the policy payloads.
#   inventory     the above plus the node DaemonSet running the Go-binary
#                 scanner (ADR 0009): which of your binaries are Go, their
#                 version and module path. Host PID and CAP_SYS_PTRACE, no eBPF.
#   ebpf          the above plus the on-node eBPF CPU profiler (ADR 0011). Adds
#                 exactly CAP_BPF and CAP_PERFMON and a read-only /sys/kernel
#                 mount. Requires profiling.allowedModulePrefixes to be set.
#
# There is no `pprof` profile. Pulling from `/debug/pprof` needs the two facts
# the node reads — a linked package and a bound port — so it is part of
# `inventory`, not an alternative to it (ADR 0057).
profile: metrics-only

image:
  repository: runtime-agent
  # Empty selects the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# What the agent collects. Anything not excluded here can still opt out per
# namespace or per workload with the collect annotation (ADR 0028).
filters:
  namespaces:
    # Empty admits every namespace; a non-empty list admits only what matches.
    # Entries may use "*" as a wildcard.
    allow: []
    # Applied on top of allow, and wins on conflict.
    deny: []

spool:
  # How long unshipped payloads are kept. 0 selects the agent's built-in
  # default (24h) — the default lives in the agent, not here, so the two cannot
  # disagree.
  #
  # There is deliberately no persistence setting. The spool is always an
  # emptyDir: unshipped payloads are loss-harmless and a reschedule loses at
  # most the span the backend had not acknowledged (ADR 0007, ADR 0026). If you
  # want that span to survive a reschedule, mount something durable at the
  # spool path yourself — that is your decision, not a knob the agent carries.
  maxAgeHours: 0

nodeIntake:
  # The audience the node's projected token requests and the controller
  # requires. One value: the chart writes it into both the DaemonSet's token
  # projection and the controller's config, and derives the expected subject
  # from the node ServiceAccount in this release's namespace. Those three
  # strings had to agree by hand before this chart existed.
  audience: rebuildstack-controller

# Profiling. Split across the two roles on purpose: the controller decides how
# many workloads may be named, the node decides what may leave it, and the node
# enforces its half from its own file with no help from anyone (ADR 0025).
#
# Which workloads may be profiled is which workloads are collected — filters
# above, and nothing else. There is no second namespace list.
profiling:
  # Controller: how many top-consuming workloads an answer may name. 0 selects
  # the agent's built-in default.
  topN: 0

  pprof:
    # Whether the controller confirms which of your collected workloads serve a
    # `/debug/pprof` endpoint. On, and it is the one collection control shipped
    # that way (docs/security.md §10.3).
    #
    # What it costs the workload is one GET of the index page, once per image
    # and port — no profiler is started and no connection is held. Which
    # workloads are asked comes from your own filters; which ports, from what
    # their processes were observed to bind. Inert without a node DaemonSet,
    # which is where both of those facts are read.
    enabled: true

    # Whether a CPU profile is then fetched from the endpoints found. Also on,
    # and it is the one thing the agent does that your process can notice: the
    # request runs that process's own profiler for ten seconds
    # (docs/security.md §10.3).
    #
    # A workload that will not start one — because its own continuous profiler
    # holds the single slot Go allows — is left alone for six hours rather than
    # competed with. Turning this off keeps the discovery above and everything
    # that rests on it.
    pull: true

  # Extra Go module-path prefixes of your own code whose stack frames may leave.
  # Everything else is redacted before anything is sent.
  #
  # You usually need none. Every profile is reduced against the modules its own
  # build states it was compiled from — the main module, and anything a `replace`
  # redirects — read from the binary, where no list can be wrong about it. Set
  # this for a shared internal module a build merely requires (ADR 0059).
  #
  # It is enforced from the agent's own file, on both paths, and no reply from
  # the controller can widen it — which is why it lives here rather than
  # arriving over the wire (ADR 0011 §4).
  allowedModulePrefixes: []
  # "drop" (default) or "keep": whether third-party dependency frames survive
  # the filter. Empty selects the agent's default.
  thirdPartySymbols: ""

  # Node: what profiling is allowed to cost this node. 0 selects the agent's
  # built-in defaults (60s captures, every 300s, 5% duty cycle).
  captureDurationSeconds: 0
  intervalSeconds: 0
  overheadCeilingPercent: 0

# How the agent behaves as a guest of a cluster it did not come with: what it
# yields to, and how long it may take to leave (ADR 0068).
#
# Empty priorityClassName gives the pod the cluster's globalDefault, or zero
# where there is none — the same priority as every unclassified workload, so at
# a tie the agent is as likely to survive as the application it measures. To make
# it yield first, apply a class of your own with a negative value and name it
# below. The chart creates no PriorityClass: a priority value only means
# something against the classes your cluster already has.
#
#   apiVersion: scheduling.k8s.io/v1
#   kind: PriorityClass
#   metadata:
#     name: rebuildstack-yields
#   value: -100
#   globalDefault: false
#   description: RebuildStack agent — preempted before customer workloads.
#
# `system-cluster-critical` and `system-node-critical` are not usable here:
# admission accepts them only for pods in kube-system, and the chart refuses
# them elsewhere rather than let a DaemonSet create no pods and not say why.
#
# There is deliberately no PodDisruptionBudget and no topologySpreadConstraints,
# in any profile. On a single replica a budget either blocks node drain outright
# or forbids nothing, and there is nothing to spread across one replica or a
# DaemonSet (ADR 0068 §2, §3).

controller:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # The memory limit is also where GOMEMLIMIT comes from: the chart passes it
    # to the agent via the downward API and the agent runs at 80% of it, so the
    # Go heap gives way before the cgroup does (ADR 0068 §5). Remove it and the
    # variable is not rendered — the downward API would substitute the node's
    # allocatable memory.
    limits:
      cpu: 500m
      memory: 256Mi
  priorityClassName: ""
  # How long the controller may take to leave. Its shutdown pass writes the
  # journals that accumulated since the last periodic flush, and the ceiling of
  # that path is about ten seconds; the default is the Kubernetes default and
  # covers it with room. Below 15 the chart refuses: SIGKILL would land before
  # the pass runs, and the minute of journals lost with it is lost silently
  # (ADR 0068 §4).
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra labels and annotations on the controller pod, for your own tooling.
  podAnnotations: {}
  podLabels: {}

node:
  # How often the node scans its processes.
  scanInterval: 60s
  # Empty selects per-profile defaults: 100m CPU for the scanner, 250m for the
  # profiler, which samples and symbolizes and therefore costs more. Whatever is
  # in force, a memory limit is what GOMEMLIMIT is derived from; set resources
  # without one and the agent runs on the Go default.
  resources: {}
  priorityClassName: ""
  # Shorter than the controller's, because the node has nothing to lose: it runs
  # no shutdown pass, and a report cut off mid-flight is re-scanned by the next
  # pod. What the number bounds is how long this agent can hold up your node
  # drain (ADR 0068 §4).
  terminationGracePeriodSeconds: 10
  # A node agent runs on every node, control-plane nodes included. Replace this
  # if you mean to exclude some — and note that an excluded node contributes no
  # inventory and no profiles, silently, because nothing there is running.
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}
  podAnnotations: {}
  podLabels: {}
