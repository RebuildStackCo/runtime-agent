{{- include "runtime-agent.validate" . -}}
{{- if include "runtime-agent.nodeEnabled" . }}
# Only the node DaemonSet may reach the controller's receiver (ADR 0040).
#
# Three decision records and a code comment described this policy as shipping
# with the chart while it did not exist, so the receiver was reachable by every
# pod in the cluster and the only thing between a caller and the endpoints was
# the token (ADR 0039). The token is still the control that decides what a
# caller may say; this decides who may be listened to at all.
#
# Rendered only alongside a node DaemonSet, for the same reason the Service is:
# a controller-only install opens no port, so there is nothing to restrict and a
# policy naming a workload that was not installed would select nothing.
#
# Two honest limits. A NetworkPolicy is enforced by the CNI, so on a cluster
# whose CNI does not implement them this object is inert — it is not a boundary
# the API server keeps for you. And it restricts reachability, not identity: a
# pod that can spoof its way past the CNI still faces the audience, the
# signature, the pinned subject and the node claim.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runtime-agent.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runtime-agent.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  # Still ingress only, and now deliberately so rather than pending.
  #
  # The controller does egress to workloads since ADR 0057, which is the change
  # this comment used to defer to. An egress policy would have to permit the API
  # server — whose address is cluster-specific and not knowable in a template —
  # plus DNS, plus arbitrary pod addresses and ports for endpoint confirmation,
  # plus a backend later. That set is everything, and a rule permitting
  # everything is a boundary in name only (ADR 0039).
  #
  # What bounds the egress is the code, and the bound is auditable: one package
  # opens outbound connections, to one path, at addresses of pods your filters
  # admitted, on ports their own processes were observed to bind.
  policyTypes:
    - Ingress
  ingress:
    # Two rules, and no third. An empty `ingress:` would deny all and an absent
    # one would allow all; this is the middle case, and each rule has to be
    # written exactly. The receiver names its source and nothing else reaches it.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: runtime-agent
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: node
      ports:
        # The container's port, numerically. A named port would resolve to the
        # same thing and read better; not every CNI implements named ports in
        # policies, and a policy that silently selects nothing is worse than a
        # number that has to stay in step with the Deployment.
        - protocol: TCP
          port: 8080
    # The health port, from anywhere, because the caller is the kubelet and it
    # arrives from the node's own address — not a pod, not a source any selector
    # in this template can name portably (ADR 0069 §5). What the rule opens is
    # two read-only paths that answer yes or no about this process and name
    # nothing in the cluster.
    - ports:
        - protocol: TCP
          port: {{ include "runtime-agent.healthPort" . }}
{{- end }}
