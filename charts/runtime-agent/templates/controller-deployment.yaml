{{- include "runtime-agent.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime-agent.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runtime-agent.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  # One replica, and not a value. The controller is the one writer of the
  # identity Secret and the one holder of the cluster's backend identity
  # (ADR 0008); a second replica would double every payload and contend for
  # that write.
  replicas: 1
  # Terminate the old controller before starting the new one. A Deployment's
  # default rolling update rounds maxSurge up to one, so `replicas: 1` would
  # still run two controllers on every upgrade; Recreate is what makes the
  # single replica mean at-most-one. Not a StatefulSet: nothing here claims a
  # volume or needs a stable name, and a StatefulSet buys the node-partition
  # case with cluster-wide collection downtime (ADR 0026).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        # Roll the controller when its configuration changes. The agent reads
        # the file once at startup, so without this a changed ConfigMap would
        # sit unread until something else happened to restart the pod.
        checksum/config: {{ include (print $.Template.BasePath "/controller-configmap.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "runtime-agent.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "runtime-agent.controllerName" . }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # Long enough for the shutdown pass to write the journals that accumulated
      # since the last periodic flush; the chart refuses a value that is not
      # (ADR 0068 §4).
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The controller holds every API grant in the product and will be the one
      # component that talks to a backend, and it needs no privilege at all: it
      # reads the API and writes a spool. So it takes the image's non-root
      # default and says so, rather than inheriting root by omission (ADR 0037).
      #
      # runAsUser is not set here: the uid comes from the image, and repeating it
      # would be the same fact in two places. runAsNonRoot is the assertion —
      # kubelet refuses to start a container whose image would run as root, so an
      # image rebuilt without its USER line fails visibly instead of quietly
      # regaining privilege.
      #
      # There is deliberately no fsGroup. It looks necessary — the spool holds
      # files a non-root process must create — and it is not: kubelet creates an
      # emptyDir world-writable (measured: drwxrwxrwx), so the uid above writes
      # there without help. An fsGroup would be a setting that does nothing,
      # justified by a belief nobody checked. It becomes necessary only if the
      # spool path is ever backed by something other than an emptyDir, which the
      # chart does not offer (ADR 0026, ADR 0037).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "runtime-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/runtime-agent/config.yaml
          ports:
            # Answered in every profile, on a port of its own: probes must not
            # depend on a receiver that half the profiles do not install
            # (ADR 0069).
            - name: health
              containerPort: {{ include "runtime-agent.healthPort" . }}
            {{- if include "runtime-agent.nodeEnabled" . }}
            - name: node-intake
              containerPort: 8080
            {{- end }}
          # The startup budget is deliberately above the five minutes a gating
          # cache may fail before the agent stops itself (ADR 0035): a refused
          # LIST should produce the agent's own diagnostic exit, not an
          # anonymous probe restart.
          startupProbe:
            httpGet:
              path: /readyz
              port: {{ include "runtime-agent.healthPort" . }}
            periodSeconds: 5
            failureThreshold: 120
          # Liveness asks the process about itself and nothing else: an API
          # server outage must not restart the agent (ADR 0069 §2).
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ include "runtime-agent.healthPort" . }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ include "runtime-agent.healthPort" . }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- if ((.Values.controller.resources).limits).memory }}
          env:
            # The limit the Go runtime does not read for itself; the agent runs
            # at a fraction of it (ADR 0068 §5). Rendered only when a memory
            # limit is: with none set the downward API substitutes the node's
            # allocatable memory, which is a worse answer than none.
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  resource: limits.memory
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/runtime-agent
              readOnly: true
            - name: spool
              mountPath: /var/spool/runtime-agent
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "runtime-agent.controllerName" . }}
        # Always an emptyDir, and no value changes it (ADR 0007, ADR 0026):
        # unshipped payloads are loss-harmless, so there is no durability option
        # to offer. An operator who wants that span to survive mounts something
        # else at this path — their decision, not a setting the agent carries.
        #
        # sizeLimit is the node's protection from this pod, and it is deliberately
        # larger than the agent's own 512Mi spool budget (ADR 0042): the agent's
        # bound is the one meant to act, and this is what holds if that ever
        # fails. Without it an emptyDir draws on the node's whole ephemeral
        # storage, and a full node makes the kubelet evict pods — other people's
        # pods, on a node this agent is a guest of.
        - name: spool
          emptyDir:
            sizeLimit: 1Gi
